[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-renderer"
version = "0.1.0"
description = "Standalone CLI for physically-based volumetric cloud rendering on top of rendervous"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ludwic Leonard Mendez", email = "lleonart1984@gmail.com"}]
dependencies = [
    "rendervous>=0.0.4",
    "numpy",
    "torch",
    "tqdm",
]

[project.optional-dependencies]
png = ["Pillow"]

[project.scripts]
cloud-renderer = "cloud_renderer.render:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloud_renderer = ["*.h"]
